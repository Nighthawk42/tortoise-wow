[project]
name = "tortoise-ai-sidecar"
version = "0.1.0"
description = "Out-of-process dialogue and personality service for Tortoise playerbots"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
